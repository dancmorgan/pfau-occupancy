[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pfau-occupancy"
version = "0.2.0a1"
description = "Async client for Planet Fitness AU (Magicline) club occupancy"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dan Morgan" }]
keywords = ["planet fitness", "magicline", "home assistant", "occupancy"]
dependencies = ["aiohttp>=3.9"]

[project.urls]
Homepage = "https://github.com/dancmorgan/pfau-occupancy"
Issues = "https://github.com/dancmorgan/pfau-occupancy/issues"

[tool.setuptools.packages.find]
include = ["pfau_occupancy*"]

[tool.setuptools.package-data]
pfau_occupancy = ["py.typed"]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
